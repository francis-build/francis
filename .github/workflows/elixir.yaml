name: Elixir CI

on:
  push:
    branches: ["main"] # adapt branch for project
  pull_request:
    branches: ["main"] # adapt branch for project

env:
  MIX_ENV: test

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Elixir minor allowed by mix.exs (`~> 1.15`), each against the
        # oldest and newest Erlang/OTP it supports, per
        # https://hexdocs.pm/elixir/compatibility-and-deprecations.html
        # Versions are loose: `1.19` / `28` resolve to the latest patch release.
        include:
          - { elixir: "1.15", otp: "24" }
          - { elixir: "1.15", otp: "26" }
          - { elixir: "1.16", otp: "24" }
          - { elixir: "1.16", otp: "26" }
          - { elixir: "1.17", otp: "25" }
          - { elixir: "1.17", otp: "27" }
          - { elixir: "1.18", otp: "25" }
          - { elixir: "1.18", otp: "27" }
          - { elixir: "1.19", otp: "26" }
          - { elixir: "1.19", otp: "28" }
          - { elixir: "1.20", otp: "27" }
          - { elixir: "1.20", otp: "29" }
    steps:
      - name: ☁️ Checkout repository
        uses: actions/checkout@v7

      - name: 💧 Setup Elixir
        uses: marmelasoft/elixir-setup@main
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: 🔬 Run unit tests
        run: mix test --exclude e2e --all-warnings --warnings-as-errors

      - name: 🌐 Run e2e tests
        run: mix test --only e2e --all-warnings --warnings-as-errors

  # Static checks don't depend on the runtime version, so they run once, on
  # the newest toolchain, in parallel with the test matrix.
  lint:
    name: Lint and analysis (Elixir 1.20 / OTP 29)
    runs-on: ubuntu-latest
    steps:
      - name: ☁️ Checkout repository
        uses: actions/checkout@v7

      - name: 💧 Setup Elixir
        uses: marmelasoft/elixir-setup@main
        with:
          otp-version: "29"
          elixir-version: "1.20"
          cache-plts: true

      - name: 🎨 Check formatting
        run: mix format --check-formatted

      - name: 💡 Lint the code
        run: mix credo --strict --all

      - name: 🔍 Analyze code
        run: mix dialyzer --format github

      - name: 🛡️ Search vulnerabilities
        run: |
          mix hex.audit
          mix deps.audit
          mix sobelow --skip --exit --threshold high

      - name: ♻️ Check unused dependencies
        run: mix deps.unlock --check-unused
