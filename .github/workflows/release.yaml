name: Release

# Builds, creates the GitHub release and publishes to Hex for one tag.
#
# Called by tag-and-release.yaml right after it pushes a new version tag: a tag
# pushed with GITHUB_TOKEN cannot trigger a `push: tags` workflow, so the call
# has to be explicit. Can also be run by hand for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3)"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        otp: ["27.3.4"]
        elixir: ["1.18.4"]

    runs-on: ${{matrix.os}}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # Everything below builds and is named from the tag, never from the ref
      # the workflow happened to run on.
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Check tag matches mix.exs version
        run: |
          VERSION=$(grep -m 1 '@version' mix.exs | sed 's/.*"\([0-9.]*\)".*/\1/')
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match @version $VERSION in mix.exs"
            exit 1
          fi

      - name: Set up Elixir
        uses: marmelasoft/elixir-setup@main
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - name: Compile project
        run: mix compile --all-warnings --warnings-as-errors

      - name: Build docs
        run: mix docs

      - name: Build archive
        run: mix archive.build

      - name: Get archive filename
        id: archive_name
        run: |
          echo "ARCHIVE_FILE=$(ls *.ez | head -n 1)" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          generate_release_notes: true
          files: ${{ env.ARCHIVE_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          mix deps.get
          mix hex.publish --yes
